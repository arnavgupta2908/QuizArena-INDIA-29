      // Fix for extensions or environments where window.fetch has only a getter
      (function() {
        try {
          var realFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = realFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Fallback if property definition is restricted
        }
      })();
    </script>
